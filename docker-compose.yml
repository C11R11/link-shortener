# Dev-only credentials. Use environment variables or a secrets manager in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports:
      - "5432:5432"
    volumes:
      - shortener_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_PORT: 3000
      SHORTENER_DOMAIN: ${SHORTENER_DOMAIN:-go.example.com}
      SHORTENER_SCHEME: ${SHORTENER_SCHEME:-https}
      DATABASE_URL: postgres://shortener:shortener@db:5432/shortener
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      REDIRECT_STATUS_CODE: ${REDIRECT_STATUS_CODE:-302}
    ports:
      - "3000:3000"

volumes:
  shortener_pgdata:
